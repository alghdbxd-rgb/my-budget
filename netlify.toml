[build]
  # يُبنى تطبيق "مصروفي" ثم تُنسخ نسخة "التاج الذهبي" الثابتة تحت /taj/
  command = "npm run build && mkdir -p dist/taj && cp -R golden-crown-web/. dist/taj/"
  publish = "dist"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
